<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool Hall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1a1210; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f6efe4; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  [hidden] { display: none !important; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #top { top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
  .team { padding: 4px 9px 5px; border-radius: 10px; background: #00000059; font-size: 12px; font-weight: 700; min-width: 0; }
  .team.b { text-align: right; }
  .team.now { background: #0000008c; box-shadow: 0 0 0 2px #ffcf5a; }
  .team .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .nm i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 0; vertical-align: 0; }
  .team .nm b { color: #ffcf5a; }
  .team .grp { font-size: 11px; opacity: .85; margin-top: 2px; white-space: nowrap; }
  .team .grp s { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 1px; vertical-align: -1px; text-decoration: none; }
  #turn { text-align: center; font: 800 18px/1.15 system-ui, sans-serif; white-space: nowrap; padding-top: 2px; }
  #turn small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
  #turn.mine { color: #ffcf5a; }
  #msg { top: 46%; left: 0; right: 0; text-align: center; font: 900 34px/1.1 system-ui, sans-serif; color: #fff; padding: 0 16px; opacity: 0; transform: translateY(-50%) scale(.85); transition: opacity .25s, transform .25s; }
  #msg.on { opacity: 1; transform: translateY(-50%) scale(1); }
  #msg.foul { color: #ff7a6b; } #msg.gold { color: #ffcf5a; }
  #bar { bottom: calc(max(8px, env(safe-area-inset-bottom)) + 18px); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 10px; min-height: 44px; }
  #hint { flex: 1; text-align: center; font-size: 14px; line-height: 1.25; }
  #net { bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .75; }
  #spin { pointer-events: auto; display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 22px; border: 1px solid #ffffff40; background: #000000a0; color: #fff; font: 700 13px system-ui, sans-serif; cursor: pointer; touch-action: none; white-space: nowrap; }
  #spin b { position: relative; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #e8e0d0 60%, #b9ae98); }
  #spin i { position: absolute; left: 50%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #d8323c; transition: top .15s; }
  @media (max-width: 600px) { #hint { font-size: 13px; } }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0806a6; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #24382c; border: 1px solid #ffffff2a; text-align: center; box-shadow: 0 10px 40px #000a; }
  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffcf5a; }
  .card h3 { margin: 14px 0 4px; font-size: 13px; color: #9fe0b4; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li.note { list-style: none; margin-left: -24px; text-align: center; opacity: .8; } /* a message, not a ranked row */
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card p { margin: 8px 0 0; font-size: 13px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: #ffcf5a; color: #3a2600; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 600px) {
    #top { grid-template-columns: 1fr 1fr; }
    #turn { grid-column: 1 / 3; grid-row: 2; font-size: 16px; }
    #msg { font-size: 26px; }
  }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><div class="team a" id="teamA"></div><div id="turn"></div><div class="team b" id="teamB"></div></div>
<div class="hud" id="msg"></div>
<div class="hud" id="bar"><div id="hint"></div><button id="spin" hidden aria-label="Spin"><b><i></i></b><span>No spin</span></button></div>
<div class="hud" id="net">Connecting…</div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ POOL HALL · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Eight-ball on a felt table: solids against stripes, sink your seven, then the 8 to win.
 * Turn-based, 2–4 players in two teams that take turns (3 or 4 players rotate inside their
 * team); bots fill the empty side.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, timings, table size, pockets, ball physics, the bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   PHYSICS ....... one shot from cue strike to the last ball stopping: cushions, pockets,
 *                   ball hitting ball, follow/draw spin. Fixed steps, so every screen agrees.
 *   RULES ......... the rack, solids/stripes, fouls, ball in hand, the 8-ball
 *   GAME (HOST) ... seats and teams, checking and starting shots, scoring them, turns.
 *                   Only the host writes the shared `game` field.
 *   BOTS .......... how a bot picks a ball and a pocket, then misses a little
 *   MY SHOT ....... placing the cue ball, aiming, power, spin, sending the shot
 *   DRAW .......... the table, balls, cue stick, the aiming guide, sparks
 *   HUD & RESULTS . team panels, whose shot, call-outs, results card, leaderboard
 *   INPUT ......... drag back to aim and set power, keys, the spin button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the table):
 *   - The whole game is ONE shared field, `game`: {id, v, phase, seats, team, turn, lastBy,
 *     grp, balls, inHand, brk, shotN, shot, res, turnAt, win, why, endsAt}. `balls` holds
 *     every ball's position ([x, y], or 0 once it is pocketed). Only the HOST writes it,
 *     and `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. A new host carries on from `game`.
 *   - On your turn you aim on your own screen and write your OWN entity `aim` {n, a, p, x, y}
 *     (shot number, angle, power, where you hold the cue ball) about 10 times a second, so
 *     everyone sees your cue move. You also write `hb` (heartbeat), `n` and `c` (name, color).
 *   - To shoot you send the intent "shot" {g, n, a, p, sp, x, y}. The host checks it is your
 *     shot, runs the whole shot at once with the fixed-step physics (so it knows every pot,
 *     the first ball hit and where everything stops) and writes `game.shot`. Every screen
 *     replays that shot with the same physics in real time, so everyone sees the same roll.
 *     When it has played out the host applies the rules and writes the new ball positions.
 *   - Bots aim on the host; their cue moves in the shared field `bot` {n, a, p, x, y}.
 *   - A player gone for 10s hands the seat to a bot; someone new takes a bot's seat, or a
 *     new seat (up to 4), or watches.
 *   - "again" (intent): someone pressed Play again on the results card.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for every game your team wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,             // bots fill the table up to this many players (two teams)
  maxSeats: 4,          // the most players in one game; 3 or 4 rotate inside their team
  turnMs: 45000,        // a player who doesn't shoot in this long gets a shot made for them
  settleMs: 700,        // ms after the balls stop before the next turn
  resultsMs: 15000,     // results show this long, then a new rack (Play again starts it at once)
  seatGraceMs: 10000,   // a seated player silent this long hands the seat to a bot
  // The table, in table units: the cloth between the cushions runs x -500..500, y -250..250.
  tableL: 1000, tableW: 500,
  rail: 46,             // the wooden rail around the cloth (drawn only)
  ballR: 12,            // ball radius
  cornerMouth: 30,      // each cushion stops this far short of a corner ...
  sideMouth: 25,        // ... and of a side pocket
  cornerR: 24, sideR: 21, // a ball whose centre gets this close to a pocket drops in
  maxSpeed: 2300,       // units/s the cue ball leaves at full power
  roll: 140,            // the cloth slows a ball by this much every second (units/s) ...
  drag: 0.32,           // ... plus this share of its speed per second
  ballBounce: 0.95,     // how much speed ball-on-ball hits keep
  railBounce: 0.74,     // ... and cushion hits
  contactPasses: 6,     // ball-on-ball passes per physics step (more = a livelier break)
  spinPower: 0.55,      // follow/draw: how much of its speed the cue ball gets back after a hit
  maxPull: 170,         // screen px you drag back for full power
  // Bots
  botThinkMs: 1900,     // a bot lines up this long before it shoots
  botAimErr: 0.011,     // how far off a bot's aim can be (radians); long, thin cuts miss more
  botNames: ["Chalky", "Bank Shot Bea", "Corner Carl", "Rack Ruth", "Side Spin Sid", "Lucky Lou"],
  board: "wins",        // leaderboard name
};
const COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#da77f2", "#ff922b", "#f783ac", "#3bc9db"];
// Ball 0 is the cue ball, 1-7 solids, 8 the black, 9-15 stripes (each stripe shares its solid's color).
const BALL_COLORS = ["#f4efe6", "#f2c11b", "#1c5bd6", "#d6282b", "#6a2bb5", "#f07a16", "#1b8f3f", "#7d1f22", "#141414"];
const ballColor = (i) => BALL_COLORS[i > 8 ? i - 8 : i];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'pool-hall',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
// A shot runs in fixed 1/480 s steps using only + - * / and sqrt, so every browser replays a
// shot exactly the same way. The host runs it to the end at once to know what happened;
// everyone (the host's screen too) plays it out in real time.
const STEP = 1 / 480;
const R = CONFIG.ballR, HL = CONFIG.tableL / 2, HW = CONFIG.tableW / 2;
const HEAD_X = -HL / 2, FOOT_X = HL / 2; // the head string (break from behind it) and the foot spot
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const r1 = (v) => Math.round(v * 10) / 10, r4 = (v) => Math.round(v * 10000) / 10000;
/** The six pockets: centre x, y and how close a ball must get to drop. */
const POCKETS = [[-HL - 6, -HW - 6, CONFIG.cornerR], [0, -HW - 13, CONFIG.sideR], [HL + 6, -HW - 6, CONFIG.cornerR],
  [-HL - 6, HW + 6, CONFIG.cornerR], [0, HW + 13, CONFIG.sideR], [HL + 6, HW + 6, CONFIG.cornerR]];
/** The cushions: straight lines that stop short of each pocket. {x1, y1, x2, y2, nx, ny} (n points onto the cloth). */
const CM = CONFIG.cornerMouth, SM = CONFIG.sideMouth;
const CUSHIONS = [
  { x1: -HL + CM, y1: -HW, x2: -SM, y2: -HW, nx: 0, ny: 1 }, { x1: SM, y1: -HW, x2: HL - CM, y2: -HW, nx: 0, ny: 1 },
  { x1: -HL + CM, y1: HW, x2: -SM, y2: HW, nx: 0, ny: -1 }, { x1: SM, y1: HW, x2: HL - CM, y2: HW, nx: 0, ny: -1 },
  { x1: -HL, y1: -HW + CM, x2: -HL, y2: HW - CM, nx: 1, ny: 0 }, { x1: HL, y1: -HW + CM, x2: HL, y2: HW - CM, nx: -1, ny: 0 },
];
/** The cushion ends (the "knuckles" at each pocket mouth) that balls can clip. */
const KNUCKLES = CUSHIONS.flatMap((c) => [[c.x1, c.y1], [c.x2, c.y2]]);

/** A shot ready to play: `balls` as the game stores them, the cue ball at (shot.x, shot.y). */
function newSim(balls, shot) {
  const b = balls.map((p, i) => ({ i, x: p ? p[0] : 0, y: p ? p[1] : 0, vx: 0, vy: 0, on: !!p, inAt: -1, px: 0, py: 0 }));
  Object.assign(b[0], { x: shot.x, y: shot.y, on: true });
  const v = shot.p * CONFIG.maxSpeed;
  b[0].vx = Math.cos(shot.a) * v; b[0].vy = Math.sin(shot.a) * v;
  return { t: 0, acc: 0, done: false, balls: b, sp: shot.sp || 0, ev: { f: -1, pots: [], rail: false }, fx: [] };
}
/** Ball hits ball: push them apart and trade speed along the line between them (equal weights). */
function collide(s, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, rr = 2 * R;
  if (d2 >= rr * rr || d2 < 1e-9) return false;
  const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, push = (rr - d) / 2;
  a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
  const closing = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (closing <= 0) return false;
  const cue = a.i === 0 ? a : b.i === 0 ? b : null, ux = cue ? cue.vx : 0, uy = cue ? cue.vy : 0, first = cue && s.ev.f < 0;
  const j = ((1 + CONFIG.ballBounce) / 2) * closing;
  a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny;
  if (first) { // the cue ball's first contact: who it hit, and the follow or draw kicks in
    s.ev.f = cue === a ? b.i : a.i;
    cue.vx += ux * s.sp * CONFIG.spinPower; cue.vy += uy * s.sp * CONFIG.spinPower;
  }
  if (closing > 40) s.fx.push({ k: "clack", x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, p: closing });
  return true;
}
/** One fixed step: move, slow down, cushions, pockets, then every pair of balls. */
function simStep(s) {
  const C = CONFIG, dt = STEP;
  s.t += dt;
  let moving = false;
  for (const b of s.balls) {
    if (!b.on) continue;
    let v = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (v === 0) continue;
    const nv = v - (C.roll + C.drag * v) * dt;
    if (nv < 4) { b.vx = 0; b.vy = 0; continue; }
    b.vx *= nv / v; b.vy *= nv / v; v = nv; moving = true;
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const c of CUSHIONS) { // a cushion: only while the ball's centre is still on the cloth side of it
      const d = (b.x - c.x1) * c.nx + (b.y - c.y1) * c.ny;
      if (d >= R || d <= 0) continue;
      const along = c.nx === 0 ? b.x : b.y, lo = c.nx === 0 ? c.x1 : c.y1, hi = c.nx === 0 ? c.x2 : c.y2;
      if (along < lo || along > hi) continue;
      const vn = b.vx * c.nx + b.vy * c.ny;
      b.x += c.nx * (R - d); b.y += c.ny * (R - d);
      if (vn < 0) { b.vx -= (1 + C.railBounce) * vn * c.nx; b.vy -= (1 + C.railBounce) * vn * c.ny; if (c.nx) b.vy *= 0.94; else b.vx *= 0.94; railHit(s, b, -vn); }
    }
    for (const [kx, ky] of KNUCKLES) { // the rounded cushion end at a pocket mouth
      const dx = b.x - kx, dy = b.y - ky, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 < 1e-9) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
      b.x = kx + nx * R; b.y = ky + ny * R;
      if (vn < 0) { b.vx -= (1 + C.railBounce) * vn * nx; b.vy -= (1 + C.railBounce) * vn * ny; railHit(s, b, -vn); }
    }
    for (const [px, py, pr] of POCKETS) { // close enough to a pocket: it drops
      const dx = b.x - px, dy = b.y - py;
      if (dx * dx + dy * dy < pr * pr) { pot(s, b, px, py); break; }
    }
    if (b.on && (b.x < -HL - R - 4 || b.x > HL + R + 4 || b.y < -HW - R - 4 || b.y > HW + R + 4)) { // through a mouth: the nearest pocket
      let best = POCKETS[0], bd = 1e9;
      for (const p of POCKETS) { const d = (b.x - p[0]) ** 2 + (b.y - p[1]) ** 2; if (d < bd) { bd = d; best = p; } }
      pot(s, b, best[0], best[1]);
    }
  }
  // Every pair of balls, a few passes while anything is still hitting: a hit runs through a row of touching
  // balls in one step, the way a break spreads a tight rack.
  const n = s.balls.length;
  for (let pass = 0, hit = true; hit && pass < CONFIG.contactPasses; pass++) {
    hit = false;
    for (let i = 0; i < n; i++) {
      const a = s.balls[i]; if (!a.on) continue;
      for (let k = i + 1; k < n; k++) {
        const b = s.balls[k]; if (!b.on || (a.vx === 0 && a.vy === 0 && b.vx === 0 && b.vy === 0)) continue;
        if (collide(s, a, b)) hit = true;
      }
    }
  }
  if (!moving || s.t > 14) { s.done = true; for (const b of s.balls) { b.vx = 0; b.vy = 0; } }
}
function railHit(s, b, speed) { if (s.ev.f >= 0) s.ev.rail = true; if (speed > 60) s.fx.push({ k: "rail", x: b.x, y: b.y, p: speed }); }
function pot(s, b, px, py) { b.on = false; b.vx = b.vy = 0; b.inAt = s.t; b.px = px; b.py = py; s.ev.pots.push(b.i); s.fx.push({ k: "pot", x: px, y: py, i: b.i }); }
/** Play a shot for dt seconds of real time. */
function simRun(s, dt) { s.acc += dt; while (s.acc >= STEP && !s.done) { s.acc -= STEP; simStep(s); } }
/** Run a whole shot at once: what happened, where everything ended up, how long it took. */
function simulateShot(balls, shot) {
  const s = newSim(balls, shot);
  while (!s.done) { simStep(s); s.fx.length = 0; }
  return { ev: s.ev, after: s.balls.map((b) => (b.on ? [r1(b.x), r1(b.y)] : 0)), dur: Math.round(s.t * 1000) / 1000 };
}

// ── RULES ───────────────────────────────────────────────────────────────────────────
const groupOf = (i) => (i >= 1 && i <= 7 ? "s" : i >= 9 ? "t" : "");      // "s" solids, "t" stripes
const groupBalls = (grp) => (grp === "s" ? [1, 2, 3, 4, 5, 6, 7] : grp === "t" ? [9, 10, 11, 12, 13, 14, 15] : []);
const GROUP_NAME = { s: "solids", t: "stripes" };
/** A fresh rack: a triangle on the foot spot, the 8 in the middle, a solid and a stripe in the back corners. */
function rackBalls() {

// With ball in hand, press on the white ball to move it first.
let drag = null, dropped = false;
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { audio ||= new AudioContext(); } catch {}
  const g = game();
  if (!g || !myTurn(g) || drag) return;
  cv.setPointerCapture(e.pointerId);
  const [x, y] = toTable(e.clientX, e.clientY);
  const place = g.inHand && Math.hypot(x - me.x, y - me.y) < Math.max(R * 2.6, 30 / scale);
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, place, ox: me.x - x, oy: me.y - y };
});
cv.addEventListener("pointermove", (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const g = game(); if (!g || !myTurn(g)) { drag = null; return; }
  if (drag.place) { // move the cue ball, never onto another ball
    const [x, y] = toTable(e.clientX, e.clientY), nx = clamp(x + drag.ox, -HL + R, g.inHand === 2 ? HEAD_X : HL - R), ny = clamp(y + drag.oy, -HW + R, HW - R);
    if (freeSpot(g.balls, nx, ny, g.inHand === 2)) { me.x = nx; me.y = ny; }
    return;
  }
  const dx = drag.sx - e.clientX, dy = drag.sy - e.clientY, len = Math.hypot(dx, dy);
  if (len < 10) { me.p = 0; return; }
  me.a = Math.atan2(M[1] * dx + M[3] * dy, M[0] * dx + M[2] * dy); // the screen pull, turned into a table direction
  me.p = clamp((len - 10) / CONFIG.maxPull, 0, 1);
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  if (!d.place && ev === "pointerup" && me.p >= 0.02) shoot(); else if (!d.place) me.p = 0;
});
addEventListener("keydown", (e) => {
  const g = game(), k = e.key;
  try { audio ||= new AudioContext(); } catch {}
  if (!g || !myTurn(g)) return;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) e.preventDefault();
  const fine = e.shiftKey ? 0.0015 : 0.008;
  if (k === "ArrowLeft") me.a -= fine; if (k === "ArrowRight") me.a += fine;
  if (k === "ArrowUp") me.p = clamp(me.p + 0.05, 0, 1); if (k === "ArrowDown") me.p = clamp(me.p - 0.05, 0, 1);
  if ((k === " " || k === "Enter") && !e.repeat) { if (me.p < 0.02) me.p = 0.5; shoot(); }
});
/** A pull that ends without a pointerup (the tab lost focus, the browser took the pointer): drop it, no shot. */
function dropDrag() { if (drag && !drag.place) me.p = 0; drag = null; }
cv.addEventListener("lostpointercapture", (e) => { if (drag && drag.id === e.pointerId) dropDrag(); });
addEventListener("blur", dropDrag);
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-button drag aims like the left one, no menu
$("spin").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); setSpin(me.sp === 0 ? 0.6 : me.sp > 0 ? -0.6 : 0); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, gameId = -1;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.acting = false; host.last = null; host.bot = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.acting = false;
  const g = game();
  if (!g) return;
  const firstSight = gameId === -1; // just joined: a shot already rolling is caught up to where it is now
  if (g.id !== gameId) { gameId = g.id; replay = null; me.pending = null; drag = null; me.turnKey = ""; }
  // a shot in state that I'm not showing yet: show it (or adopt it, if it's my own that I already started)
  if (g.shot && (!replay || replay.n !== g.shot.n)) {
    const sh = g.shot, pend = me.pending;
    if (replay && replay.n === null && pend && pend.a === sh.a && pend.p === sh.p && pend.sp === sh.sp && replay.shot.x === sh.x && replay.shot.y === sh.y) replay.n = sh.n;
    else startReplay(sh, g.balls, firstSight);
    me.pending = null;
  }
  if (me.pending && performance.now() - me.pending.at > 2500) { me.pending = null; if (replay && replay.n === null) replay = null; } // the host didn't take it
  if (replay) {
    simRun(replay.sim, dt); playFx(replay.sim);
    if (replay.sim.done && replay.n !== null && (!g.shot || g.shot.n !== replay.n)) replay = null; // played out and counted: back to the game's positions
  }
  myTick(g);
  draw(g, dt, now);
  if (now - lastHud > 120) { lastHud = now; hud(g); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("shot", (m, from) => { if (host.acting && m) hostShot(from, m); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  me.id = net.sessionId;
  const g0 = parse(S.shared.game, null), taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(g0 ? g0.seats.filter((s) => s.bot).map((s) => s.c) : [])]);
  me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) { Object.assign(CONFIG, { botThinkMs: 900, settleMs: 250, resultsMs: 1500, botAimErr: 0.006 }); fit(); }
  requestAnimationFrame(frame);
})();
</script>
